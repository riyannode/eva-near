services:
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: judge
    init: true
    environment:
      APP_MODE: sandbox
      APP_ORIGIN: http://127.0.0.1:${EVA_PORT:-8080}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready',{signal:AbortSignal.timeout(9000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      timeout: 10s
      start_period: 40s
      retries: 5
    stop_grace_period: 20s
  frontend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      EVA_MODE: sandbox
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EVA_PORT:-8080}:8080"
