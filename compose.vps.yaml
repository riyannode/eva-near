services:
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: server
    init: true
    read_only: true
    environment:
      APP_MODE: testnet
      NEAR_RPC_URL: ${NEAR_RPC_URL:?Configure the Testnet RPC URL}
      NEAR_CONTRACT_ID: ${NEAR_CONTRACT_ID:?Configure the Reference contract}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Configure the public HTTPS origin}
    restart: "on-failure:3"
  frontend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: frontend/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${EVA_PORT:-8080}:8080"
